name: Deploy para cPanel

on:
  push:
    branches:
      - main # O deploy acontecerá sempre que você enviar código para a branch 'main'

jobs:
  build-and-deploy:
    name: Build e Deploy FTP
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Baixar o código do repositório
      uses: actions/checkout@v4

    - name: ⚙️ Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Instalar dependências (Bun/NPM)
      run: npm install

    - name: 🏗️ Fazer o Build (Gerar pasta dist)
      # Aqui injetamos as variáveis do Supabase no processo de build
      env:
        VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      run: npm run build

    - name: 🌐 Enviar arquivos para o cPanel (FTP)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/ # Pasta que será enviada
        server-dir: / # ⚠️ ATENÇÃO: Mude aqui se o seu site não for ficar na raiz do public_html
